# -----------------------------------------------------------------------------
# REBS HRMS - stateless nginx mock API (Option A)
#
# Serves canned JSON from ./data and switches behaviour per request with the
# `X-Mock-Scenario` header (or `?mock_scenario=` for curl/browser testing).
#
#   normal               default, successful responses
#   slow                 ~3 s delay, then the normal response
#   timeout              never answers (client times out after 10 s)
#   server_error         500 on every endpoint
#   duplicate_attendance POST /attendance/events -> 409 ATTENDANCE_EXISTS
#   attendance_rejected  POST /attendance/events -> 422 (e.g. outside geofence)
#   replay               POST /attendance/events -> 200 replayed:true
#
# Limitation (documented in README): nginx keeps no state, so POSTed data is
# not echoed back by later GETs and idempotency is enforced/tested client-side.
#
# Run (Docker):   docker compose -f mock_api/docker-compose.yml up
# Run (Windows):  cd mock_api\nginx && nginx.exe -p . -c nginx.conf
# -----------------------------------------------------------------------------

worker_processes 1;

events {
    worker_connections 256;
}

http {
    default_type  application/json;
    charset       utf-8;
    charset_types application/json;
    server_tokens off;
    sendfile      off;

    # Scenario: query param wins (handy for curl), then header, then "normal".
    map $arg_mock_scenario $scenario_raw {
        default $arg_mock_scenario;
        ""      $http_x_mock_scenario;
    }
    map $scenario_raw $scenario {
        default $scenario_raw;
        ""      normal;
    }

    server {
        listen      8080;
        server_name _;
        root        data;

        add_header X-Mock-Scenario $scenario always;

        location = /health {
            return 200 '{"status":"ok"}';
        }

        # ---------------- public endpoints ----------------

        location = /employee/me {
            include scenario.conf;
            rewrite ^ /__ok/employee/me last;
        }

        # GET /attendance?month=YYYY-MM (month is accepted but ignored: static data)
        location = /attendance {
            include scenario.conf;
            rewrite ^ /__ok/attendance last;
        }

        location = /attendance/events {
            if ($request_method != POST) {
                return 405 '{"code":"METHOD_NOT_ALLOWED","message":"Use POST"}';
            }
            if ($scenario = duplicate_attendance) {
                return 409 '{"code":"ATTENDANCE_EXISTS","message":"Attendance for this day has already been recorded on the server."}';
            }
            if ($scenario = attendance_rejected) {
                return 422 '{"code":"ATTENDANCE_INVALID","message":"Server rejected the event: location is outside the permitted office area."}';
            }
            if ($scenario = replay) {
                return 200 '{"status":"accepted","replayed":true,"serverEventId":"$request_id","receivedAt":"$time_iso8601"}';
            }
            include scenario.conf;
            rewrite ^ /__ok/attendance/events last;
        }

        # ---------------- canned successful responses ----------------

        location = /__ok/employee/me      { internal; try_files /employee.json =500; }
        location = /__ok/attendance       { internal; try_files /attendance.json =500; }

        location = /__ok/attendance/events {
            internal;
            return 201 '{"status":"accepted","replayed":false,"serverEventId":"$request_id","receivedAt":"$time_iso8601"}';
        }

        # ---------------- fault injection ----------------
        # 10.255.255.1 is a non-routable address: the TCP connect never completes,
        # which gives us a deterministic delay without third-party modules.

        # slow: wait 3 s for the connect to time out, then serve the normal response.
        location ~ ^/__slow(?<target>/.+)$ {
            internal;
            proxy_connect_timeout 3s;
            proxy_pass http://10.255.255.1:9;
            error_page 502 504 = /__ok$target;
        }

        # timeout: hang for 60 s (the app gives up after 10 s).
        location ^~ /__hang/ {
            internal;
            proxy_connect_timeout 60s;
            proxy_pass http://10.255.255.1:9;
        }

        location / {
            return 404 '{"code":"NOT_FOUND","message":"Unknown mock endpoint"}';
        }
    }
}
