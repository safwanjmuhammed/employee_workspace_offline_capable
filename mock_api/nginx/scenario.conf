# Shared fault-injection rules, included by every public endpoint.
if ($scenario = server_error) {
    return 500 '{"code":"SERVER_ERROR","message":"Simulated internal server error."}';
}
if ($scenario = timeout) {
    rewrite ^(.*)$ /__hang$1 last;
}
if ($scenario = slow) {
    rewrite ^(.*)$ /__slow$1 last;
}
